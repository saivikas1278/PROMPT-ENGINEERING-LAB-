<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Transport Assistant</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar">
        <div class="logo">🚌 Public Transport Assistant</div>
    </nav>
    
    <div class="container">
        <div class="hero">
            <h1>Public Transport & Route Assistant</h1>
            <p class="subtitle">Plan Smarter • Travel Better • Reach Faster</p>
        </div>
        
        <div class="search-card">
            <form id="search-form">
                <div class="form-group">
                    <label for="source">From:</label>
                    <select name="source" id="source" required>
                        <option value="" disabled selected>Loading locations...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="destination">To:</label>
                    <select name="destination" id="destination" required>
                        <option value="" disabled selected>Loading locations...</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Find Routes</button>
            </form>
        </div>
        
        <div id="loading" style="display: none; text-align: center; margin-top: 2rem;">
            <p>Searching for best routes...</p>
        </div>
        
        <div id="error" style="display: none; text-align: center; margin-top: 2rem; color: red;">
            <p id="error-message"></p>
        </div>
        
        <div id="results-container" style="display: none; margin-top: 2rem;">
            <div class="results-header">
                <h2 id="results-title"></h2>
            </div>
            
            <div id="map" style="display: none; height: 400px; margin-bottom: 20px; border-radius: 8px;"></div>
            
            <div class="summary-cards" id="summary-cards"></div>
            
            <div class="route-list" id="route-list"></div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="static/js/script.js"></script>
</body>
</html>
