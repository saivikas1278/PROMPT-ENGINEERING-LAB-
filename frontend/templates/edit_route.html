{% extends "base.html" %}

{% block content %}
<div class="page-header" style="margin-top: 24px;">
    <h2>Edit Route</h2>
    <a href="/admin/routes" class="btn btn-secondary">Cancel</a>
</div>

<div class="search-card" style="max-width: 600px; margin: 0 auto;">
    <form action="/admin/routes/edit/{{ route.id }}" method="POST">
        <div class="form-group">
            <label for="bus_number" class="form-label">Bus Number</label>
            <input type="text" id="bus_number" name="bus_number" class="form-control" value="{{ route.bus_number }}" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="source" class="form-label">Source</label>
                <input type="text" id="source" name="source" class="form-control" value="{{ route.source }}" required>
            </div>
            
            <div class="form-group">
                <label for="destination" class="form-label">Destination</label>
                <input type="text" id="destination" name="destination" class="form-control" value="{{ route.destination }}" required>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="distance" class="form-label">Distance (km)</label>
                <input type="number" id="distance" name="distance" class="form-control" step="0.1" min="0" value="{{ route.distance }}" required>
            </div>
            
            <div class="form-group">
                <label for="travel_time" class="form-label">Time (min)</label>
                <input type="number" id="travel_time" name="travel_time" class="form-control" min="0" value="{{ route.travel_time }}" required>
            </div>
            
            <div class="form-group">
                <label for="fare" class="form-label">Fare (₹)</label>
                <input type="number" id="fare" name="fare" class="form-control" step="0.1" min="0" value="{{ route.fare }}" required>
            </div>
        </div>
        
        <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
            <button type="submit" class="btn btn-primary">Update Route</button>
        </div>
    </form>
</div>
{% endblock %}
