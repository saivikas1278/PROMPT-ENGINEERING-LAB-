{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Admin Portal</h2>
            <p class="text-muted">Sign in to manage routes</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div style="background-color: #fef2f2; color: var(--danger); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; text-align: center; font-size: 0.9rem; border: 1px solid #fecaca;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="admin">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 12px;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
