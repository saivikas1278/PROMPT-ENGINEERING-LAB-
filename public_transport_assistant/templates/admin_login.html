{% extends "base.html" %}

{% block content %}
<div class="search-card" style="max-width: 400px; margin: 0 auto;">
    <h2 style="text-align: center; color: var(--primary); margin-bottom: 20px;">Admin Login</h2>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="background-color: var(--danger); color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
          {% for message in messages %}
            {{ message }}
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required>
        </div>
        
        <button type="submit" class="btn-primary">Login</button>
    </form>
</div>
{% endblock %}
